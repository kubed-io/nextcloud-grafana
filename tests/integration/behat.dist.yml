# Behat config for the grafana_sync integration suite.
#
# Behat is the Nextcloud-native integration framework (see nextcloud/deck). It
# drives a *running* Nextcloud (over HTTP / occ) and the Grafana service, and asserts
# both sides — the real wiring the unit suite mocks out (saga §5).
#
# Output: Behat's BUILT-IN junit formatter (no third-party dep) writes JUnit XML
# to junit/, which the integration workflow feeds to the same EnricoMi reporter
# the unit suite uses → sticky PR comment + job summary.
#
# Env the FeatureContext reads (set by the workflow / local runner):
#   NC_BASE_URL, NC_ADMIN_USER, NC_ADMIN_PASS, GRAFANA_URL, OCC

default:
  # The four status tags all mean "do not run me", for four different reasons —
  # @todo (code exists, test missing), @unbuilt (spec awaiting code), @blocked
  # (the harness cannot reach it), @decision (there is no operation to run). Only
  # @todo is a work queue; the others are documentation. See features/README.md.
  #
  # All four must be excluded here. An untagged scenario is CLAIMING to be live,
  # and --strict makes CI enforce that claim by failing on any undefined step —
  # which is the whole safety net. Leaving @unbuilt out of this filter would make
  # every spec-only scenario a build failure the moment it was tagged honestly.
  gherkin:
    filters:
      tags: '~@todo&&~@unbuilt&&~@blocked&&~@decision'

  # THREE SUITES, AND THEY ARE A PARTITION — every feature file belongs to exactly
  # one. `bin/check-suites.sh` enforces that mechanically, because the failure
  # mode of getting it wrong is SILENT: a file in no suite is simply never run,
  # and a green build says so confidently.
  #
  # Running plain `behat` runs all three in sequence, which is exactly the old
  # single-suite coverage — the split is inert until something selects a suite.
  # That is deliberate: it lets CI prove the partition covers everything BEFORE
  # the workflow starts depending on it (`behat --suite=dashboard` per leg).
  #
  # THE AXIS IS THE FILENAME, NOT A TAG. Tags look like the obvious split and are
  # the wrong tool: `@occ`, `@ui` and `@in-grafana` are carried by some scenarios
  # and not others, so any tag partition leaks — the untagged ones would match no
  # leg and quietly stop running, with every leg still green. A path partition
  # cannot leak, because `ls features/*.feature` minus the union must be empty and
  # that is one line to check.
  #
  #   admin      the settings surface — the connection, the mapping list, and
  #              removing a mapping. Grouped because admin work is a different
  #              SESSION from user work, not merely a different tag.
  #   dashboard  the verbs, as they apply to a dashboard (a .grafana.json file):
  #              create, copy, move, rename, delete, restore, edit.
  #   core       everything else: the same verbs on a FOLDER, plus the first sync,
  #              identity, looking at a mirror, tags, purge and the app lifecycle.
  #
  # WHY `folder` IS NOT ITS OWN SUITE YET, though it is the obvious fourth and is
  # exactly how nextcloud-penpot splits (admin/design/project/core): all 56 of its
  # scenarios are specification — the folder-mirroring engine lands in a later
  # course — so the leg would boot a Nextcloud and a Grafana to run nothing at
  # all. It splits out with the engine, which is a one-line move that
  # check-suites.sh verifies.
  suites:
    admin:
      paths:
      - '%paths.base%/../../features/connection/connection.feature'
      - '%paths.base%/../../features/connection/sync-now.feature'
      - '%paths.base%/../../features/mapping/create.feature'
      - '%paths.base%/../../features/mapping/manage-groups.feature'
      - '%paths.base%/../../features/mapping/sync-now.feature'
      - '%paths.base%/../../features/mapping/delete.feature'
      - '%paths.base%/../../features/mapping/rename.feature'
      - '%paths.base%/../../features/mapping/move.feature'
      contexts: &contexts
      - OCA\GrafanaSync\Tests\Integration\FeatureContext

    dashboard:
      paths:
      - '%paths.base%/../../features/dashboards/create.feature'
      - '%paths.base%/../../features/dashboards/copy.feature'
      - '%paths.base%/../../features/dashboards/delete.feature'
      - '%paths.base%/../../features/dashboards/edit.feature'
      - '%paths.base%/../../features/dashboards/move.feature'
      - '%paths.base%/../../features/dashboards/rename.feature'
      - '%paths.base%/../../features/dashboards/restore.feature'
      contexts: *contexts

    core:
      paths:
      - '%paths.base%/../../features/folders/create.feature'
      - '%paths.base%/../../features/folders/copy.feature'
      - '%paths.base%/../../features/folders/delete.feature'
      - '%paths.base%/../../features/folders/move.feature'
      - '%paths.base%/../../features/folders/rename.feature'
      - '%paths.base%/../../features/folders/restore.feature'
      - '%paths.base%/../../features/folders/purge.feature'
      - '%paths.base%/../../features/dashboards/view.feature'
      - '%paths.base%/../../features/dashboards/open-with.feature'
      - '%paths.base%/../../features/dashboards/tags.feature'
      - '%paths.base%/../../features/dashboards/purge.feature'
      - '%paths.base%/../../features/lifecycle.feature'
      contexts: *contexts

  formatters:
    # Human-readable progress in the log…
    pretty:
      verbose: true
    # …and machine-readable JUnit for the CI reporter.
    junit:
      output_path: '%paths.base%/junit'
