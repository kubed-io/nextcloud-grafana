name: 🔗 Integration

# Integration tests — prove the real wiring the unit suite mocks out, on a live
# Nextcloud + Grafana. Framework: **Behat** (the Nextcloud-native integration
# framework), run from tests/integration/. Behat drives `occ` and (later stages)
# NC's API + the Grafana REST API, and asserts both sides. Its BUILT-IN junit
# formatter emits JUnit XML, which the same EnricoMi reporter the unit suite uses
# turns into a sticky PR comment + summary.
#
# Setup follows the official apps: check out nextcloud/server, mount this app into
# apps/grafana_sync, install on SQLite. Grafana runs as a GHA services: container
# (pre-built image). Unlike n8n, Grafana has a HEADLESS token mint — the suite's
# own bin/mint-grafana-token.sh creates an Editor service account + token over
# admin basic-auth, so no secret needs to be supplied.

on:
  pull_request:
    branches:
    - main
    paths:
    - .github/workflows/integration.yml
    - appinfo/**
    - lib/**
    - templates/**
    - features/**
    - tests/integration/**
    - composer.json
  push:
    branches:
    - main

permissions:
  contents: read
  # Behat results → sticky PR comment + check run (EnricoMi), like the unit suite.
  checks: write
  pull-requests: write

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

# Static values here so `run:` steps are pure bash reading $VARS — never inline
# Github templating (see CONTRIBUTING.md "Workflow authoring conventions").
env:
  APP_ID: grafana_sync
  GRAFANA_URL: http://localhost:3000
  GRAFANA_ADMIN_USER: admin
  GRAFANA_ADMIN_PASS: admin
  NC_ADMIN_USER: admin
  NC_ADMIN_PASS: admin

jobs:

  # WHICH NEXTCLOUDS THIS RUN COVERS, decided by what triggered it.
  #
  # A PR runs the CEILING ONLY. That is where the work is aimed and where a real
  # break shows up, and it keeps review cheap: three legs, not nine. `main` runs
  # every major in info.xml's range — floor, middle and ceiling — so the whole claim
  # is executed on every merge instead of once per push to every branch.
  #
  # The bet, stated plainly so it can be revisited: a change that works on the newest
  # Nextcloud and breaks an older one is RARE, and when it happens it is a bug found
  # after merge rather than a regression shipped — `main` is the gate before a
  # release, not the PR. If that stops being true (say two floor breaks in a row),
  # move the range back onto the PR and pay the legs.
  #
  # Computed here rather than with an `if` on the matrix, because a matrix cannot be
  # conditioned in place — a job has to hand it over as JSON.
  versions:
    name: Which Nextclouds
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
    - name: Pick the server versions for this trigger
      id: pick
      env:
        # Bound, not interpolated into the script — see the env: note at the top.
        EVENT: ${{ github.event_name }}
      run: |
        if [ "$EVENT" = "pull_request" ]; then
          matrix='["stable34"]'
        else
          matrix='["stable32", "stable33", "stable34"]'
        fi
        echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
        echo "Nextcloud versions for this $EVENT run: $matrix" >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: Integration ${{ matrix.suite }} (${{ matrix.server-versions }})
    runs-on: ubuntu-latest
    needs: versions

    # ── THE SUITE AXIS DIVIDES THE SCENARIOS ─────────────────────────────────
    # Three legs each run a slice of features/, in parallel. The split is by
    # FILENAME (behat.dist.yml explains why a tag partition leaks), and
    # `bin/check-suites.sh` fails the quality job if features/ is not covered
    # exactly once.
    #
    # BE HONEST ABOUT WHAT THIS BUYS TODAY: 36 of the repo's 215 scenarios are
    # live, so the wall-clock win is small — `dashboard` is 23 of them and the
    # other two legs are short. The win is structural. The partition is the thing
    # that stops a feature file from silently falling out of the run, it is what
    # the family's other two apps already do, and it is the axis a second one
    # multiplies against: as the specification goes live (the folder engine alone
    # is 56 scenarios) the legs are already there to absorb it.
    #
    # A STORAGE-BACKEND AXIS (Team Folder vs admin-owned) IS NOW UNBLOCKED but
    # deliberately not here. It was impossible while `add-mapping` merely
    # persisted — a mapping had no folder until a sync made one. Creating a
    # mapping now provisions its folder, and groupfolders is installed below, so
    # the axis is a matrix line away. It doubles the legs, so it gets its own run
    # rather than riding on a behaviour change, where a failure would be
    # ambiguous.
    #
    # fail-fast: false is load-bearing. With it on, one flaky leg cancels the
    # others and you lose the signal from the legs that were fine.
    # ── AND THE SERVER AXIS RUNS THEM AGAINST THE NEXTCLOUDS WE CLAIM ────────
    # The second axis, and this session is what paid for it: a copy's modified
    # time is reverted by Nextcloud on 33.0.8.2 and kept on 33.0.4.1. Two PATCH
    # releases of one major disagreed about whether a stamped clock survives the
    # request, which cost hours precisely because the live instance and CI were on
    # different ones and only one of them could reproduce it.
    #
    # A version we advertise support for and never execute is a claim, not a fact.
    # WHICH versions run is decided by the `versions` job above — the ceiling on a
    # PR, the full range on main — and the ceiling is the one that matters most,
    # because a new major disables the app outright rather than failing a scenario.
    strategy:
      fail-fast: false
      matrix:
        # Handed over by the `versions` job above: the ceiling on a PR, the whole
        # declared range on main. SQLite is the fast integration path.
        server-versions: ${{ fromJSON(needs.versions.outputs.matrix) }}
        suite: [admin, authoring, copying, naming, trash, motion, tags, folders, core]

    services:
      # Grafana with its admin user provisioned from env — a background container
      # via the GHA services feature. The token the suite uses is minted from
      # these admin creds at runtime (bin/mint-grafana-token.sh).
      grafana:
        image: grafana/grafana:13.0.2
        ports:
        - 3000:3000
        env:
          GF_SECURITY_ADMIN_USER: admin
          GF_SECURITY_ADMIN_PASSWORD: admin
          # Keep it quiet + fast to boot for CI.
          GF_ANALYTICS_REPORTING_ENABLED: "false"
          GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
          GF_LOG_LEVEL: error
        options: >-
          --health-cmd "wget -q -O - http://localhost:3000/api/health | grep -q ok"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 40
          --health-start-period 15s

    steps:
    # ── Provision: install everything up front, before any action runs ───────
    - name: Checkout server
      uses: actions/checkout@v7
      with:
        repository: nextcloud/server
        ref: ${{ matrix.server-versions }}
        submodules: true

    - name: Checkout app into apps/
      uses: actions/checkout@v7
      with:
        path: apps/${{ env.APP_ID }}

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        # Match the production pod / the rest of our CI.
        php-version: '8.4'
        extensions: mbstring, iconv, fileinfo, intl, sqlite, pdo_sqlite, gd, zip, curl, xml
        coverage: none
        tools: composer:v2

    - name: Install Behat deps
      working-directory: apps/${{ env.APP_ID }}/tests/integration
      run: composer install --prefer-dist --no-progress

    - name: Install Nextcloud (SQLite)
      run: |
        mkdir -p data
        ./occ maintenance:install \
          --database=sqlite \
          --admin-user="$NC_ADMIN_USER" \
          --admin-pass="$NC_ADMIN_PASS"
        ./occ config:system:set trusted_domains 1 --value=localhost
        # WebDAV scenarios reach NC over HTTP at localhost:8080 (see below), so
        # that host:port must be trusted too.
        ./occ config:system:set trusted_domains 2 --value=localhost:8080

    # TEAM FOLDERS ARE OPT-IN, AND THE SUITE HAS TO BE ABLE TO OPT IN.
    #
    # groupfolders is an optional app, which is exactly why `use_team_folder`
    # defaults to FALSE: the default mapping must be one that provisions on a
    # stock Nextcloud. It briefly defaulted to true here, which made the default
    # the one backend a plain install cannot create.
    #
    # So this install is not there to serve the default — it is there so the
    # scenarios that NAME `| storage | team folder |` have something to run
    # against. Without it those rows would be unrunnable and the Team Folder path
    # would go uncovered, which is how a Team Folder mapping once came to be
    # *storable* on an instance that could never make one.
    #
    # WHAT IS NOT COVERED, AND IS WORTH KNOWING: every leg has groupfolders, so
    # nothing here proves the app survives on a server WITHOUT it. That is a real
    # exposure — TeamFolderService resolves the groupfolders FQCN lazily for
    # precisely this reason, and a guard with no test behind it is one refactor
    # from being deleted. It wants one cheap leg, not a second full axis.
    # THE APP STORE IS SOMEBODY ELSE'S UPTIME, and this step made every leg depend
    # on it. `occ app:install` fetches from apps.nextcloud.com at run time, and when
    # that fetch fails the error is `Could not download app groupfolders, it was not
    # found on the appstore` — which reads like the app was removed and is usually
    # just the runners being rate-limited. It took out both this repo and the n8n
    # sibling simultaneously, on green branches, minutes after the same branches had
    # passed. Nothing about the app was wrong and nothing in the diff was at fault.
    #
    # So the download happens ONCE per server version and is cached. On a hit there
    # is no network at all; on a miss the install is retried before giving up, which
    # is what turns a rate-limit blip from a red build into a slow step.
    - name: Cache Team Folders (groupfolders)
      id: groupfolders-cache
      uses: actions/cache@v4
      with:
        path: apps/groupfolders
        key: groupfolders-${{ matrix.server-versions }}-v1

    - name: Install Team Folders (groupfolders)
      run: |
        if [ ! -d apps/groupfolders ]; then
          # Three attempts with backoff: the failure this guards against is a
          # transient fetch, so the retry is the fix and the cache is the prevention.
          for attempt in 1 2 3; do
            if ./occ app:install groupfolders; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::groupfolders could not be downloaded after 3 attempts — apps.nextcloud.com is likely unreachable or rate-limiting this runner"
              exit 1
            fi
            echo "app:install failed (attempt $attempt) — retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
        else
          echo "restored groupfolders from cache — no app store fetch"
        fi
        # Always enable: a cache hit restores the files but not the DB state.
        ./occ app:enable groupfolders
        ./occ app:list | grep -i groupfolders

    # ── Serve: occ-only scenarios need no HTTP, but the WebDAV channel does.
    # PHP's built-in server is enough for DAV; no nginx/fpm needed. Backgrounded.
    - name: Start Nextcloud (php built-in server)
      run: |
        php -S localhost:8080 -t "$GITHUB_WORKSPACE" >/tmp/nc-web.log 2>&1 &
        echo "NC_WEB_PID=$!" >> "$GITHUB_ENV"
        for i in $(seq 1 30); do
          if curl -fsS -o /dev/null "$NC_BASE_URL/status.php"; then echo "NC web up"; exit 0; fi
          sleep 2
        done
        echo "NC web server did not come up" >&2; cat /tmp/nc-web.log >&2; exit 1
      env:
        NC_BASE_URL: http://localhost:8080

    # ── Readiness: wait for the Grafana service container ────────────────────
    - name: Wait for Grafana
      run: |
        for i in $(seq 1 40); do
          if curl -fsS "$GRAFANA_URL/api/health" | grep -q '"database": *"ok"'; then echo "Grafana healthy"; exit 0; fi
          sleep 3
        done
        echo "Grafana did not become healthy" >&2; exit 1

    # ── Act: everything provisioned and ready — now do the work ──────────────
    # PREREQUISITE (not a feature): mint a Grafana service-account token so the
    # tests can act as an admin who already has one. How the token is created is
    # out of the app's scope — this is pure test setup. Grafana's admin API mints
    # it over basic-auth (no secret to supply). Fails the job loudly if no token.
    # The token is exposed as a step output for later steps; NOT stored anywhere.
    - name: Mint Grafana token (prerequisite)
      id: grafana_token
      run: |
        token="$(bash apps/$APP_ID/tests/integration/bin/mint-grafana-token.sh)"
        if [ -z "$token" ]; then echo "no token minted" >&2; exit 1; fi
        echo "::add-mask::$token"
        echo "token=$token" >> "$GITHUB_OUTPUT"
        echo "✅ Grafana service-account token obtained (length ${#token})"

    # PREREQUISITE control case: create a sample folder + dashboard in Grafana
    # through Grafana's OWN API (not via the app under test), so mapping/pull
    # scenarios have a real, pre-existing folder+dashboard to act on.
    - name: Preload a sample dashboard into Grafana (prerequisite)
      env:
        GRAFANA_TOKEN: ${{ steps.grafana_token.outputs.token }}
      run: bash apps/$APP_ID/tests/integration/bin/preload-grafana.sh

    # Behat runs from the integration dir; OCC points back at the server root so
    # `occ` resolves. Formatters (pretty → stdout, junit → junit/) are configured
    # in behat.dist.yml, so no --format flags needed here.
    #
    # --strict is what makes the status tags mean something. Without it an
    # undefined step is reported as "undefined" and the run still passes, so an
    # untagged scenario can silently describe behaviour nothing tests — the exact
    # ambiguity the four status tags exist to remove. With it, leaving a scenario
    # untagged is a claim that CI enforces. Matches the penpot sibling.
    - name: Run Behat
      working-directory: apps/${{ env.APP_ID }}/tests/integration
      env:
        OCC: php ${{ github.workspace }}/occ
        NC_BASE_URL: http://localhost:8080
        # The minted token, available to scenarios as an "admin already has a token".
        GRAFANA_TOKEN: ${{ steps.grafana_token.outputs.token }}
        # Bound here rather than interpolated into `run:` — a `${{ }}` inside a
        # shell script is substituted BEFORE the shell sees it, which mixes
        # templating with logic and is an injection seam. Read as a plain $VAR.
        SUITE: ${{ matrix.suite }}
      # No --tags: the status filter lives in behat.dist.yml and a CLI --tags would
      # REPLACE it rather than add to it. check-suites.sh pins the two together the
      # moment a leg ever needs to pass one.
      run: vendor/bin/behat --config behat.dist.yml --strict --suite="$SUITE"

    # ONE RESULT FOR THE WHOLE RUN, NOT THREE. Each leg only UPLOADS its JUnit
    # XML; the publish job below collects them and reports once. Publishing per
    # leg would produce three checks and three PR comment updates for one test
    # run, which buries the answer to "did the suite pass?" under the mechanics of
    # how it was split.
    #
    # `if: always()` so a failing leg still contributes its results — a leg that
    # fails is exactly the one whose report you want.
    - name: Upload JUnit results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        # Unique per leg: artifacts with the same name collide. The server version
        # is in the name because the suite name alone stopped being unique the
        # moment a second axis landed — see the publish job's guard.
        name: junit-${{ matrix.server-versions }}-${{ matrix.suite }}
        path: apps/${{ env.APP_ID }}/tests/integration/junit/*.xml
        retention-days: 7
        if-no-files-found: error

    - name: Nextcloud log on failure
      if: failure()
      run: |
        if [ -f data/nextcloud.log ]; then cat data/nextcloud.log; else echo "no nextcloud.log"; fi
        echo "── php built-in server log ──"
        if [ -f /tmp/nc-web.log ]; then cat /tmp/nc-web.log; else echo "no nc-web.log"; fi

  # ── one report for the whole matrix ────────────────────────────────────────
  # This is the action's own documented matrix pattern, and it needs NO XML
  # merging: `files` is a glob and the action aggregates across every file it
  # matches.
  publish-integration-results:
    name: Integration results
    needs: integration
    if: always()
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read

    steps:
    # NO `merge-multiple`. Behat names its report after the SUITE, so every leg
    # writes a differently-named file today — but the moment a second axis lands
    # (the storage backend is coming), two legs share a suite name and
    # `merge-multiple: true` would flatten them into one directory where the
    # second download silently overwrites the first. That produced a green report
    # over a red matrix on nextcloud-penpot. Left off, each artifact lands in
    # `junit/<artifact-name>/`, unique by construction.
    - name: Download every leg's results
      uses: actions/download-artifact@v8
      with:
        path: junit
        pattern: junit-*

    # The guard, because that failure mode is SILENT — the report looks healthy
    # and simply describes a different, smaller run. One leg uploads exactly one
    # suite report, so any collision shows up as fewer files than directories.
    - name: Every leg is present
      run: |
        dirs=$(find junit -mindepth 1 -maxdepth 1 -type d | wc -l)
        files=$(find junit -name '*.xml' | wc -l)
        echo "legs: $dirs, reports: $files"
        find junit -name '*.xml' | sort
        if [ "$dirs" -eq 0 ]; then echo "::error::no leg uploaded a report"; exit 1; fi
        if [ "$dirs" -ne "$files" ]; then
          echo "::error::$dirs legs but $files reports — results are being overwritten"
          exit 1
        fi

    - name: Publish integration results
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        check_name: Integration test results
        files: junit/**/*.xml
        comment_mode: always
        # The legs already fail the workflow on a failing scenario; this job
        # exists to REPORT, so it must not turn a reporting hiccup into a second
        # red X for the same failure.
        action_fail: false
