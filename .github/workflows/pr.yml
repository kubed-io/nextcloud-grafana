name: 🔀 PR

# Ensure the PR owner is set and they added to the changleog. 

on:
  pull_request:
    branches:
    - main
    # `labeled`/`unlabeled` are here so the `no changelog` escape hatch below actually
    # takes effect. Without them the default trigger set is opened/synchronize/reopened,
    # the check has already run and failed by the time anyone reaches for the label, and
    # the only way to clear it is a manual re-run or an empty commit. A documented
    # escape hatch that needs a second, undocumented step is not one.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  # Auto-assign needs to write the assignee on the PR.
  pull-requests: write

jobs:

  pr-tasks:
    name: PR Tasks
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    # Assign the PR author to their own PR per .github/assign.yml.
    - name: Auto Assign
      uses: kentaro-m/auto-assign-action@v2.0.2
      with:
        configuration-path: .github/assign.yml

    # Fail the PR if CHANGELOG.md has no new entry under [Unreleased] — the
    # release workflow consumes that section as the release notes, so every PR
    # has to contribute something to it.
    #
    # THE ESCAPE HATCH IS THE `no changelog` LABEL, which is the action's own
    # default and so is not repeated here. Put it on a PR that genuinely produces
    # nothing a user would read about in release notes: spec-only work, test
    # coverage, CI plumbing, a dependency bump. Dependabot applies it itself via
    # .github/dependabot.yml.
    #
    # It is deliberately a LABEL rather than a path filter. "Is this worth telling
    # a user about?" is a judgement, and a rule that answers it from the diff gets
    # it wrong in both directions — a one-line lib/ change can be invisible, and a
    # spec change can be the most important thing in a release.
    - name: Make sure Changelog is updated
      uses: tarides/changelog-check-action@v4
      with:
        changelog: CHANGELOG.md
